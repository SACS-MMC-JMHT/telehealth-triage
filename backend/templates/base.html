<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0077cc" />
  <link rel="manifest" href="/static/manifest.json" />
  <title>{% block title %}TeleHealth Triage{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">TeleHealth Triage</a>
    {% if user.is_authenticated %}
      <nav>
        {% if user.is_staff %}
          <a href="{% url 'intake:queue' %}">Queue</a>
        {% else %}
          <a href="{% url 'intake:form' %}">New Intake</a>
        {% endif %}
        <a href="{% url 'logout' %}">Log Out</a>
      </nav>
    {% endif %}
  </header>
  <main class="container">
    {% if messages %}
      <ul class="messages">
        {% for m in messages %}<li class="msg-{{ m.tags }}">{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/queue_poll.js" defer></script>
</body>
</html>
